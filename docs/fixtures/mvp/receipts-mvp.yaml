# MVP do receipts: os requisitos, um a um (grelha do dono com o coordenador, 2026-10-29).
# Aprovado pelo dono em 2026-10-29 (PR #201).
# Direção nova do dono: ferramenta para quem vende comida (bolos, doces, marmitas), no modelo do app "Cake Pricing":
# custo, preço, lucro, pedidos e estoque; nutrição e medidas caseiras são o diferencial. O chat é a tela inicial.
# Base: PRD 15 (docs/finalizacao/prd-15-receipts.md) com as decisões da grelha. Saem do MVP: RF-12/13/14 (social,
# código desligado), RF-29..32 (infra TBCA: seguem como tarefas, não contam), RF-39 (pergunta "O que você faz?").
# Fora do MVP: rótulo ANVISA, offline, pedidos recorrentes, preço sugerido pela região.
# Para aprovar: o dono confere a lista e preenche approval.by, approval.at e
# approval.digest = `python3 mvp_manifest.py digest docs/mvp.yaml`. Mudou a lista depois? O digest não bate: nova aprovação.
# Evidência por requisito (o que não dá para verificar é "sem evidência" e não conta):
#   prs:        PRs do código; nível "mergeado com CI verde".
#   acceptance: - test: caminho do teste + ci: {job, step} que o roda; ou - ci: job; nível "aceite verde".
#   homolog:    - url: https://... ou /caminho sobre homolog.base_url (expect: 200, contains: "texto");
#               - ci: {job: homolog-smoke}; ou - run: docs/homolog/rf-01.json (registro: status pass, at, env homolog).
#   issues:     só ligam o requisito ao trabalho; não contam.
