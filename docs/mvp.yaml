# MVP do harness (lista aprovada pelo dono em 01/11/2026): lista curta, só o que a esteira consumidora precisa para medir os
# produtos pelo docs/mvp.yaml. Não é a lista da 1.0.
# Decisão do dono: o harness é o contrato e a verificação da esteira; o validador, o digest e o relatório de
# progresso do mvp.yaml passam a morar aqui (docs/DIRECAO-2026-10-29.md, #254). Cada biblioteca lista de 5 a 12 itens.
# Base: o porte já mergeado (src/mvp.ts, #259) comparado com a implementação de referência que a esteira usa hoje.
# Fora da lista (um por linha):
#   - loop próprio de execução (tick/deliver), que deixa de crescer;
#   - benchmark, atestados e pacotes de evidência assinados;
#   - atualizações de dependências major (ink 8, commander 15, mermaid 12, motion 14);
#   - comando para aprovar a lista (o dono preenche approval à mão).
# Aprovação: approval.digest é o digest desta lista (ak-harness mvp digest / mvp_manifest.py digest); mudou a lista, precisa aprovar de novo.
