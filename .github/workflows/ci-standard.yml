name: CI standard

# This repository's settings for the organization's reusable CI pipeline
# (AgentsKit-io/.github, docs/ci.md). Called by release-harness.yml (the file name is load-bearing for npm
# Trusted Publishing, so the pipeline call lives there instead of a ci.yml).

on:
  workflow_call:
    outputs:
      mode:
        description: Pipeline mode (draft, light, pr, full, seed or skip).
        value: ${{ jobs.standard.outputs.mode }}

permissions: {}

jobs:
  standard:
    uses: AgentsKit-io/.github/.github/workflows/ci.yml@c624db48051670469618d9c74854f3a1affc0138
    permissions:
      actions: write
      contents: read
    with:
      installer: native
      typecheck-command: bash scripts/ci/check.sh
      test-command: pnpm vitest run --config vitest.config.ts test
      affected-test-command: pnpm vitest run --config vitest.config.ts --changed "$BASE_REF" test
      build-command: bash scripts/ci/build.sh
      job-timeout-minutes: 20
