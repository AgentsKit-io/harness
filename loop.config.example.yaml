# @agentskit/harness — keep-pushing loop configuration.
# Copy to <your project>/loop.config.yaml. Everything project-specific lives here; the loop code has no names, paths or ids.
# Never put secrets in this file: `envKeys` are the NAMES of environment variables the loop checks, not their values.
schemaVersion: 1

# Defaults for this kind of project, merged BELOW every other layer: it fills silence and overrides nothing.
# `ak-harness loop init` writes a config that extends one of these and states only what the preset cannot know.
# extends: web-app                   # web-app | library | monorepo | data-pipeline | mobile

# Four layers, most specific wins, each with one owner:
#   1. ~/.agentskit/harness.yaml          the user   — identity, models/providers, effort, machine capacity, notifications
#   2. loop.config.yaml (this file)       the project — weighs more than the global, which stays untouched
#   3. loop.config.team.<key>.yaml        the team    — what diverges between teams in the same repo (`project.team`)
#   4. loop.config.local.yaml             the machine — gitignored, the last word
# `$AK_HARNESS_CONFIG` moves the global file, `$AK_LOOP_TEAM` overrides the team key, `$AK_HARNESS_NO_GLOBAL=1`
# loads the project without the user layer (what CI sees).
project:
  name: my-project
  repo: my-org/my-project            # GitHub owner/name used for PR review and merge
  baseBranch: main
  root: .                            # relative to this file
  # team: platform                   # selects loop.config.team.platform.yaml; a declared team without a file fails loudly
  orchestratorView: base            # base = the orchestrator reads a fresh worktree of origin/<baseBranch>; root = this checkout as-is
  stateDir: .ak-loop                 # runtime state: ledger, cooldowns, contracts, events, agent memory, plans.
                                     # Per machine — add it to .gitignore. The config (this file) stays at the
                                     # repo root and IS versioned.
  setup:
    # command: [pnpm, install, --frozen-lockfile]  # argv (no shell), run once in a freshly created worktree
                                                     # before the worker terminal opens; unset = skip
    timeoutSec: 600
    required: true                    # failing/timing-out setup removes the worktree and counts as a dispatch failure

orca:
  bin: orca                          # on Linux outside Orca terminals use orca-ide (bare `orca` is the GNOME screen reader)
  # repoSelector: id:<orca-repo-id>  # default: path:<project.root>
  # workspaceSelector: path:/abs/main/checkout   # existing worktree the automations run in
  # host: runtime:<environment-id>   # paired remote Orca host
  minVersion: 1.4.200
  timeoutMs: 20000

# Revisão mais rigorosa só nas fatias que pedem, por label. A revisão É o gate quando não há CI, e um
# contrato que congela evidência não deve ser julgado com o mesmo orçamento de um ajuste de copy.
# Primeira entrada que casa vence, e só os campos nomeados são trocados.
# reviewOverrides:
#   - anyLabels: [layer:L2, layer:L3]
#     votes: 2
#     minSeverity: nit
#     reason: caminho crítico do MVP

# Suítes já vermelhas na branch base. O harness NÃO roda o verifyCommand — o worker roda, na worktree
# dele — então tolerar falha conhecida é informação no briefing, não parsing de saída. A issue de
# rastreamento é obrigatória: quarentena sem dono vira permanente.
# knownFailures:
#   - path: packages/foo/tests/bar.test.ts
#     issue: ENG-123
#     reason: corrida de escrita em arquivo, pré-existente

linear:
  workspaceId: <linear-workspace-id> # orca linear team list --workspace all --json
  teamKey: ENG
  person: my-linear-display-name     # the queue this machine drains (and, under unassigned ownership, the name it claims with)
  queueOwnership: person             # person = the issues assigned to `person`. unassigned = the issues nobody holds,
                                     # with the assignee as a transient claim the loop writes on dispatch and clears on
                                     # return, so several machines share one priority-ordered queue.
                                     # Switching to unassigned REQUIRES clearing the backlog's assignees: with `person`
                                     # and an unassigned backlog the queue comes back empty and the loop looks healthy
                                     # while doing nothing.
  people:                            # display name -> Linear user id (orca linear team members …)
    my-linear-display-name: <linear-user-id>
  rotation:
    enabled: false                   # set true to advance through owners when the current dispatchable queue drains
    owners: [my-linear-display-name] # ordered display names; the first entry is the initial owner
    advanceWhenEmpty: true           # never switch while an implementation lease remains
  states: [Todo, Ready]              # dispatchable states; anything already started is left alone
  entryState: Backlog                # where `loop plan decompose --create` files new issues; must not be in states
  excludeLabels: [blocked, needs-info]
  requireLabels: []                  # ALL of these (AND); empty = no constraint
  anyLabels: []                      # at least ONE of these (OR) — how a machine declares the slices it
                                     # drains, e.g. [layer:L2, layer:L3]. requireLabels cannot say this:
                                     # it demands every label on the same issue, so two layers there
                                     # match nothing and the queue comes back silently empty.
  projects: []                       # empty = all projects
  order: [priority, updatedAt]       # urgent first; priority 0 (none) sorts last
  maxQueue: 50
  inProgressState: In Progress
  reviewState: In Review
  doneState: Done
  blockedLabel: blocked
  needsInfoLabel: needs-info

models:
  # routing.mode: tiers (default) | hybrid | dynamic | catalog
  # hybrid = keep quality tiers, pick highest remaining usage inside each tier
  # catalog = discover models via CLI/builtin/(optional) Artificial Analysis + usage
  routing:
    mode: hybrid
    usageMetric: max
    preferKnownUsage: true
    # policy: quality-first          # quality-first | usage-balanced | cost-first — orders the candidates a role
                                     # already allows; it never widens the set
  # cost:                            # relative cost per provider/model, any unit; only the order matters
  #   codex/gpt-5.6-luna: 1
  #   claude/opus: 9
  # roles: { orchestrator: { quality: balanced }, reviewer: { quality: balanced }, builder: { quality: balanced }, watcher: { quality: fast } }
  # cheapest-sufficient (default): orchestrator/reviewer read and extract, builder writes the code — neither of
  # the first two should outrank the role doing the open-ended work. Raise one to frontier only where it earns it.
  # catalog: { sources: [cli, builtin], artificialAnalysis: { enabled: false } }
  # Tiers, in order. Inside a tier the first provider with usage available wins.
  # Tier 1 = subscriptions, tier 2 = cheap hosted, tier 3 = last resort.
  orchestrator: [[codex/gpt-5.6-sol, claude/opus], [opencode/opencode-go/glm-5.3], [grok/grok-4-fast]]
  reviewer:     [[codex/gpt-5.6-sol, claude/opus], [opencode/opencode-go/glm-5.3], [grok/grok-4-fast]]
  builder:      [[codex/gpt-5.6-luna, claude/sonnet, claude/haiku], [opencode/opencode-go/glm-5.3-flash], [grok/grok-4-fast]]
  watcher:      [[claude/haiku, codex/gpt-5.6-luna], [opencode/opencode-go/glm-5.3-flash]]
  cooldown:
    initialMin: 30                   # provider marked exhausted without a known reset waits 30 min, doubling…
    maxMin: 240                      # …up to 4 h
    probeBeforeReenable: true
    exhaustedPercent: 100
  # Reasoning effort requested per role. Only applied for providers below that declare `effortFlag`; others ignore it.
  effort:
    orchestrator: medium            # cheapest-sufficient: turning an issue into a contract is bounded work
    reviewer: medium                # currently unused: agentskit-review has no reasoning-effort flag (see reviewProvider below)
    builder: high                   # the role that writes and debugs the code is the hardest problem here
    watcher: low
  providers:
    claude:
      bin: claude
      auth: subscription
      envKeys: [ANTHROPIC_API_KEY]   # optional API-key fallback
      tui: "claude --model {model} --permission-mode auto"
      headless: [claude, -p, "{prompt}", --model, "{model}", --permission-mode, plan, --output-format, text]
      # effortFlag: "--effort {effort}"
    codex:
      bin: codex
      auth: subscription
      envKeys: [OPENAI_API_KEY]
      # Codex 0.154+ uses explicit approval/sandbox flags; --full-auto is not a valid CLI option.
      tui: "codex -m {model} -s workspace-write -a never"
      headless: [codex, exec, -m, "{model}", -s, read-only, --skip-git-repo-check, "{prompt}"]
      # effortFlag: "-c model_reasoning_effort={effort}"
    opencode:
      bin: opencode
      auth: none
      orcaUsageKey: opencodeGo       # key inside `orca account list` rateLimits
      tui: "opencode -m {model}"
      headless: [opencode, run, -m, "{model}", --agent, plan, "{prompt}"]
    grok:
      bin: grok
      auth: subscription             # `grok login` (OAuth) — no API key needed
      # --trust pre-grants folder trust for this fresh worktree, the same way grok's own PTY e2e tests do
      # (--yolo --trust); without it the first-run "trust this folder?" dialog blocks with no TTY to answer it.
      # Deliberately not --yolo: that also relaxes the permission mode this loop's hook (ADR-0038) relies on.
      tui: "grok -m {model} --trust"
      headless: [grok, -p, "{prompt}", -m, "{model}"]
      # effortFlag: "--reasoning-effort {effort}"

machine:
  floor: 1                           # always allow one worker
  # ceiling: 4                       # default: cpus / 2
  minFreeRamGb: 4
  warningPercent: 75
  criticalPercent: 90
  agentRssMb: 1400                   # RAM budget per agent when live RSS is unknown
  wslCap: 1                          # host Defender load is invisible from a WSL distro

delivery:
  verifyCommand: "pnpm lint && pnpm test"   # what the worker must pass before opening a PR
  review:
    cli: agentskit-review
    mode: trusted-local              # reuse this user's CLI logins; the isolated default has no credentials
    profile: fast                    # one bounded pass over required lenses; `full` needs batching to fit a 600 s stage
    votes: 1
    concurrency: 4
    minSeverity: med                  # nit < med < high < blocker; findings at/above this block auto-merge
    # doctorProbe: help                 # help | none — how `loop doctor` probes the review CLI
    deadlineMs: 600000
    # subprocessTimeoutMs: 300000     # agentskit-review's own inner CLI-call timeout (AGENTSKIT_REVIEW_SUBPROCESS_TIMEOUT_MS),
                                     # separate from deadlineMs above; its own unset default (120s) was routinely too
                                     # short for an ordinary review and silently landed as status: incomplete
    # analysisMaxTokens: 800000       # agentskit-review's own per-run analysis token budget (no CLI flag; set via a
    # analysisGlobalMaxTokens: 2000000 # generated --config file) — its own default (~87_200 usable under --profile fast)
                                     # can abort an ordinary PR review with "analysis tokens budget exceeded"
    # smallChangeLines: 0            # >0: a change at or below this many lines (or docs-only) is reviewed by the
                                     # cheapest candidate instead of the strongest — cost lever 3
    # criticalPaths: []              # path prefixes that always get the strongest reviewer, whatever the size
  # smoke:
  #   enabled: false
  #   kind: verify-argv
  #   argv: [pnpm, test]
  merge:
    auto: true
    method: squash
    requireChecks: true
    requireHumanApproval: false        # true: also require a human GitHub review approval before merging, even
                                        # after a clean loop review + green checks
  maxFixRounds: 2
  workerIdleTimeoutMin: 45
  # maxDispatchMinutes: 240                # hard ceiling on one dispatch regardless of activity; unset = disabled
  handoff: { enabled: true, maxHandoffs: 2, onlyWhenProviderUnavailable: true }
  selfEditPaths: [loop.config.yaml, ".github/**"]   # PRs touching these never auto-merge
  # secretFilePatterns: [...]              # default already covers .env, *.pem, *.key, id_rsa, credentials.json, etc.
                                            # PRs touching a matching filename are held, never reviewed or merged
  # workerGuard: { enabled: true }         # real-time enforcement of the two lists above, inside claude/grok's own
                                            # session (not just at PR-review time); opencode gets static deny rules
                                            # instead. codex is not covered yet — see ADR-0038. On by default.
  ignoreChecks: []                   # advisory check names that never block
  requiredChecks: []                 # empty = every reported check must be green
  cleanupWorktree: true              # remove the Orca worktree after merge
  returnState: Todo                  # where a stuck/blocked issue goes back to


# --- 0.6.0 optional SDLC seams (defaults keep prior behaviour) ---
memory:
  enabled: false                     # set true to recall approved learnings into contract/brief (token reduction)
  # backend: file
  # preferOverDocBridge: true        # shrink Doc Bridge refs when memory covers them
  # maxRecall: 5
  # maxBlockChars: 1200
  # categories: [adjustment]         # only these LearningRecord categories become memory on promote
  # issueCharsWithMemory: 4000
  # recurrence:
  #   minSightings: 2                # a lesson proposed this many times is a pattern, not an anecdote
  #   maxPerRun: 3
  # autoPromote:
  #   enabled: false                 # true: the retro promotes the recurring lessons itself, as `loop-auto`
                                     # (never as `human` — ADR-0019, amendment 2026-09-19). Revoke any of them with
                                     # `ak-harness loop learning reject --ids … --by human`.

# Where work comes from when nobody typed it. Each source is argv printing a JSON array of alerts
# ({ id?, title, body?, severity?, url?, count? }); the same alert is filed once per dedupe window, with its
# evidence, in the queue's entry state. A severity mapped here is the only way the incident flow starts by itself.
# intake:
#   enabled: false
#   labels: [source:alert]
#   dedupeWindowHours: 168
#   maxPerRun: 5
#   flowBySeverity: { p0: incident }
#   sources:
#     - id: sentry
#       command: [./scripts/sentry-alerts.sh]
#       labels: [area:runtime]

# Dependencies, security and licences on a schedule — inside the loop, under the same DoD. A check with nothing
# to decide files nothing; that is the difference from a bot that opens a PR every morning.
# maintain:
#   enabled: false
#   dedupeWindowHours: 168
#   checks:
#     - id: audit
#       command: [pnpm, audit]
#       title: "Security advisories need a decision"
#       fileWhen: exit-code        # exit-code | output
#       labels: [area:security]

# Ceilings on what the loop may spend. A budget that is reached ESCALATES; it never insists — the loop calling the
# same model again with less headroom is how a bad hour becomes a bad week.
# budget:
#   perProvider: 100                 # % of a provider's window the loop may use; the rest stays for the human
#   perIssueTokens: 0                # tokens one issue may cost across every loop call; 0 = no ceiling

# Which implementation of each connector this project uses. The engine speaks only to the interfaces
# (TrackerConnector, ScmConnector, RunnerConnector); adding Jira, GitLab or a cloud sandbox is a new
# implementation and a new value here, never a change in tick, deliver or release.
# connectors:
#   tracker: linear
#   scm: github
#   runner: orca                     # `local` = git worktree + tmux + the system crontab, no Orca at all
#   local:
#     worktreeRoot: ../.ak-worktrees
#     tmuxBin: tmux
#     cronMarker: "# ak-harness"     # every crontab line the harness owns carries it; nothing else is touched

# Promotion and deploy. The loop closes an issue when it merges into `project.baseBranch` — the integration
# branch. `release` moves the approved batch to `branch` and runs the project's deploy, and it never starts
# without `ak-harness loop release approve`: everything that acts on the world keeps a human in front of it.
# release:
#   enabled: false
#   branch: production
#   deploy: [./scripts/deploy.sh]     # argv (no shell), run in project.root after the promotion push
#   smoke: [./scripts/smoke.sh]       # non-zero → rollback (when declared) and escalate
#   notesFile: RELEASE-NOTES.md       # release notes for the batch, newest first, committed before promoting
#   rollback: [./scripts/rollback.sh] # the project declares what undoing its own deploy means

# The roles that run per issue. The planner and the vote run IN THE HARNESS, headless, before dispatch — the same
# shape as freezing the contract: the model writes the plan and the votes, the machine counts them and decides. A
# worker is only launched once a plan has consensus, so it starts from an approved plan instead of inventing one.
# Default (nothing declared) is today's behaviour: builder → review.
# worker:
#   plan:
#     enabled: false
#     votes: 3                        # how many agents vote
#     approvals: 2                    # how many must approve
#     maxCycles: 3                    # plan → vote → replan cycles before it becomes a human's problem
#     timeoutMs: 300000

# The project's half of the Definition of Done — the same list for every issue, every item provable. The issue's
# half is the frozen contract's outcomes. A PR merges only when both lists are proven, and the loop writes the two
# lists with the worker's evidence onto the PR. There is no `manual` kind: what cannot be proven is not a DoD item.
# dod:
#   evidenceFile: .ak-loop/dod.json   # where the worker records its proofs, relative to the worktree root
#   items:
#     - id: verify
#       description: lint and tests pass
#       kind: command                 # the worker runs it in its worktree; exit 0 is the proof
#       command: [pnpm, lint]
#     - id: test-for-new-code
#       description: new code ships a test
#       kind: file-changed            # the PR must touch a path matching `glob`
#       glob: "**/*.test.ts"
#     - id: no-todo
#       description: no TODO left behind
#       kind: pattern-absent          # no changed file may contain `pattern`
#       pattern: "TODO|FIXME"
#       paths: ["src/**"]

# Knobs the retro may move by itself, each inside a declared range and justified by a declared metric — and
# reverted by the same metric when the next cycle is worse (that knob is then frozen until a human clears it).
# Never auto-adjustable, whatever is listed here: models, providers, gates and branches.
# tuning:
#   enabled: false
#   maxChangesPerRetro: 1            # one change per cycle, so a bad cycle stays explainable
#   commit: false                    # true: commit the edited loop.config.yaml with the reason and the evidence
#   knobs:
#     - path: delivery.review.minSeverity
#       metric: review-findings-ratio     # metrics: review-findings-ratio · stuck-count · fix-rounds-per-merge · escalation-count
#       values: [med, nit]                # ordered ladder, cheapest first
#     - path: delivery.workerIdleTimeoutMin
#       metric: stuck-count
#       min: 15
#       max: 45
#       step: 5

# The roles are agents the project installed (`npx agentskit add <id>` → `agents/<id>/`): the code is yours, the
# copy in the repo IS the version, git is the history. With autoImprove the retro proposes ONE dated note to the
# instructions of the role with the worst outcome-per-run ratio, and keeps it only if the eval still passes.
# `architect` and `reviewer` are never auto-changed, and publishing back to the registry is always a human.
# agents:
#   registryPath: agents.registry.yaml
#   requireRegistry: false
#   autoImprove: false
#   evalCommand: [npm, run, eval]    # without it nothing is adopted: a change that cannot be measured is a guess
#   maxAutoLines: 5                  # a bigger proposal waits for a human
#   minRatio: 0.5                    # bad outcomes per run below which no role is worth improving

# rag:
#   enabled: false
#   queryArgv: []                    # argv printing ContextSnapshot JSON on stdout
#   maxReferences: 4

# mcp:                               # public API / ADR-0028 — not wired into tick/deliver
#   enabled: false
#   allowTools: []

contract:
  maxIssueChars: 12000               # issue text rendered into the orchestrator prompt (as untrusted data)
  timeoutMs: 300000
  maxContextReferences: 6            # Doc Bridge hits appended when .doc-bridge/index.json exists
  reuseHours: 72                     # cached contract reused for this long
  docBridgeMaxAgeHours: 168           # doctor warns when .doc-bridge/index.json is older
  requireDocBridge: false
  briefScopes: [playbook, for-agents] # Doc Bridge scopes listed in the worker brief
  maxBriefReferences: 4
  contextProviders: [doc-bridge]      # add rag when rag.enabled

github:
  intakeLabel: loop:review           # a PR with this label is reviewed even though the loop never dispatched it;
                                      # null disables intake entirely
  reviewOnly: true                   # fixed: intake PRs are always review + comment, never auto-merged

plugins:
  modules: []                        # e.g. [scripts/loop-plugins/notify.mjs] — local .mjs files (relative to
                                      # project.root, never fetched over the network) loaded once per tick/deliver;
                                      # each exports { id, apply(bus) } and can subscribe to loop events or block a
                                      # beforeDispatch/beforeReview/beforeMerge hook — see docs/LOOP.md

security:
  pii:
    enabled: false                    # scan issue text / worker brief for PII-shaped patterns before embedding them
    action: redact                    # redact | warn | block

resilience:
  maxConsecutiveFailures: 3          # pause an issue after this many consecutive contract/dispatch failures
  pausedLabel: loop:paused           # applied to the issue in Linear; remove it (or `loop resume <id>`) to retry
  stagePauseAfterRuns: 3             # pause `loop stage tick|deliver` itself after this many consecutive thrown runs
  # maxUsageDeltaPercent: 40          # stop a dispatch if its provider's remaining usage drops by this many
                                      # points while the issue is in flight (cost circuit breaker). Defaults to 40
                                      # even when unset — raise it to 100 to make it effectively never trip.

brief:
  skills: []                         # e.g. [AGENTS.md, CLAUDE.md, docs/for-agents/INDEX.md] — paths relative to project.root,
                                      # pinned verbatim into every worker brief (sha256-digested in dispatch.json); a
                                      # missing file fails the dispatch instead of silently sending a worker without it
  maxSkillChars: 6000                 # per-file cap; longer files are truncated with a visible note

# Named flow profiles: one motor, several kinds of demand. A profile replaces only the fields it names; a selection
# rule picks one per issue by LABEL, then PROJECT, then PRIORITY (a label is an intention, a priority is a signal),
# and `flows.default` covers everything else. `flow:<name>` on an issue always wins.
# flows:
#   default: enterprise
#   profiles:
#     enterprise:
#       review: { votes: 2, minSeverity: nit }
#       merge: { requireChecks: true, requireHumanApproval: true }
#       reason: critical path
#     poc:
#       review: { votes: 1, minSeverity: high }
#       merge: { requireChecks: false }     # no CI babysitting: the review is the gate, and no runner bill
#       maxFixRounds: 1
#     incident:
#       review: { votes: 1, minSeverity: blocker }
#       merge: { requireChecks: false, requireHumanApproval: false }
#   select:
#     - flow: incident
#       anyLabels: [sev1]
#       priorities: [Urgent]

# Where the loop calls a human. The tracker comment always happens — this is the channel on top of it. Two generic
# shapes, zero vendor code: a webhook (Slack, Discord, Telegram bot, n8n) and a local command (system notification,
# mail CLI). This file is versioned, so the URL comes from an environment variable; a literal `url` belongs only in
# the user's own ~/.agentskit/harness.yaml.
# notifications:
#   events: [contract.escalated, contract.failed, issue.paused, stage.paused, pr.merge-refused]
#   webhook:
#     urlEnv: LOOP_WEBHOOK_URL
#     headers: { x-source: harness }
#   command: [terminal-notifier, -title, AgentsKit, -message, "{summary}"]   # {summary} {event} {issue} {json}

schedule:
  tick: "*/5 * * * *"
  deliver: "*/10 * * * *"
  precheckTimeoutSec: 120
  harnessCommand: ak-harness         # how the Orca automation runs the harness inside the workspace
  namePrefix: loop                   # automations: loop-tick, loop-deliver[, loop-retro][, loop-observe]
  # retro: weekly                     # with retroIssue, installs <prefix>-retro
  # retroIssue: AGE-0                 # Linear issue that receives the digest comment
  # This file is the source of truth for every automation. `loop install` reconciles Orca against it — creating what
  # is missing, editing only what drifted, switching off what this file stopped declaring — so changing a schedule is
  # editing the YAML and running install, never editing the automation inside Orca.
  # observe: "*/15 * * * *"           # installs <prefix>-observe: a read-only health scan whose precheck exits 0 —
                                      # launching the observer agent — only when a problem is new or overdue
  # observer:
  #   since: 24h                      # event window the scan reads
  #   reminderHours: 2                # an unresolved, already-reported problem set repeats at most this often
  #   schedulerStallMin: 20           # no automation run in this long means the scheduler itself stopped
  #   staleLockMin: 30                # a stage lock older than this is abandoned, not a long run
  runner: precheck                   # the stage runs inside Orca's precheck command; no agent session is ever opened
  stageTimeoutSec: 600               # Orca caps prechecks at 600 s; one tick/deliver run must fit
  # provider: claude                 # Orca agent that executes the automation prompt (default: watcher role)
